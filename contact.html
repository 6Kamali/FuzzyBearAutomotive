<section class="container">
    <h2>Get a Mobile Quote</h2>
    <p>Locked out or need a spare? Fill out the form below or call us directly.</p>
    
    <form action="YOUR_BACKEND_LINK" method="POST">
        <input type="text" placeholder="Your Name" required>
        <input type="text" placeholder="Vehicle Year, Make, & Model" required>
        <input type="tel" placeholder="Phone Number" required>
        <textarea placeholder="Describe your issue (e.g., Lost all keys, need a spare fob)"></textarea>
        <button type="submit" class="btn">Send Request</button>
    </form>
</section>
